services:
  backend:
    build:
      context: ./fastapi_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./fastapi_backend/.env
    environment:
      OCR_SERVICE_URL: http://ai-service:8001
    depends_on:
      ai-service:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./ai-service/.env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
